        const bothStriking=['left','right'].some(side=>side!==name&&['extending','strike'].includes(game.punches[side].phase));
        const canStart=!game.playerGuarded&&!bothStriking&&fistReady&&state.phase==='ready'&&angle>startAngle&&angularVelocity>.48&&speed>.38;
        if(canStart){state.phase='extending';state.phaseStartedAt=now;state.peakSpeed=speed}
        const contact=state.phase==='extending'&&angle>contactAngle&&speed>.68&&angularVelocity>-.5&&now>state.cooldownUntil;
        if(contact){
          state.phase='strike';state.phaseStartedAt=now;state.cooldownUntil=now+300;
          const upward=velocity.y<-.4&&Math.abs(velocity.y)>Math.abs(velocity.x)*.75;const lateral=Math.abs(velocity.x)>Math.abs(velocity.z)*1.12&&Math.abs(velocity.x)>.48;
          const type=upward?'АППЕРКОТ':lateral?'ХУК':name==='left'?'ДЖЕБ':'КРОСС';const power=clamp(4+state.peakSpeed*5+(angle-contactAngle)*9,6,20);registerPlayerPunch(type,power,name)
        }
        if(state.phase==='strike'&&(angle<2.22||now-state.phaseStartedAt>230)){state.phase='recovering';state.phaseStartedAt=now}
        if(state.phase==='recovering'&&angle<1.84&&speed<.9)state.phase='ready';
        if(state.phase==='extending'&&(angle<1.75||now-state.phaseStartedAt>480))state.phase='ready';
      }
    }
    function fighterDistance(){return fighterA.position.distanceTo(fighterB.position)}
    const hitPointA=new THREE.Vector3(),hitPointB=new THREE.Vector3(),hitPointC=new THREE.Vector3();
    function gloveWorld(robot,side,out=new THREE.Vector3()){robot.updateWorldMatrix(true,true);return robot.userData.arms[side==='left'?0:1].knuckle.getWorldPosition(out)}
    function findImpact(attacker,target,side,targetGuarded=false){
      const glove=gloveWorld(attacker,side,hitPointA);target.updateWorldMatrix(true,true);
      if(targetGuarded){const guardLeft=gloveWorld(target,'left',hitPointB),guardRight=gloveWorld(target,'right',hitPointC);if(Math.min(glove.distanceTo(guardLeft),glove.distanceTo(guardRight))<.74)return{kind:'block',distance:0}}
      const head=target.userData.head.getWorldPosition(hitPointB);const chest=target.userData.torso.getWorldPosition(hitPointC);chest.y+=.72;
      const headDistance=glove.distanceTo(head),bodyDistance=glove.distanceTo(chest);if(headDistance<.86)return{kind:'head',distance:headDistance};if(bodyDistance<1.3)return{kind:'body',distance:bodyDistance};return null;
    }
    function applyRecoil(target,from,power){
      const direction=new THREE.Vector2(target.position.x-from.position.x,target.position.z-from.position.z);if(direction.lengthSq()<.01)direction.set(0,1);direction.normalize();
      const recoil=target===fighterB?game.botRecoil:game.playerRecoil;recoil.addScaledVector(direction,clamp(power*.032,.12,.58));
      const data=target.userData;data.torso.rotation.z+=(target===fighterB?-1:1)*clamp(power*.009,.045,.17);data.head.rotation.z+=(target===fighterB?-1:1)*clamp(power*.014,.06,.24);
    }
    function registerPlayerPunch(type,power,side){
      if(game.paused)return;
      if(game.mode==='training'){game.hits++;showImpact(type);setCoach(type,`Сила удара: ${Math.round(power)} · Верните руку в защиту.`,'good');return}
      if(!game.running)return;
      const impact=findImpact(fighterA,fighterB,side,game.botGuard);if(!impact){game.misses++;showImpact('МИМО');setCoach('Удар мимо','Попадание считается только при контакте перчатки с головой или корпусом.','warn');return}
      const defended=impact.kind==='block';const zoneMultiplier=impact.kind==='head'?1.18:impact.kind==='body'?0.9:0.22;const damage=Math.round(power*zoneMultiplier);game.botHealth=clamp(game.botHealth-damage,0,100);game.hits++;game.combo++;game.maxCombo=Math.max(game.maxCombo,game.combo);game.botStun=defended?.12:.34;game.botLean=defended?.06:.22;applyRecoil(fighterB,fighterA,defended?power*.22:power);showImpact(defended?'БЛОК':impact.kind==='head'?`${type} · ГОЛОВА`:type);if(game.botHealth<=0)endRound('ПОБЕДА')
    }

    function drawPose(lm,hands=game.hands){
      const canvas=ui.overlay,video=ui.cameraVideo;if(!video.videoWidth)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#72f2d2';ctx.fillStyle='#d5fff4';ctx.lineWidth=Math.max(2,canvas.width/450);const links=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];for(const[a,b]of links){if((lm[a].visibility??1)<.35||(lm[b].visibility??1)<.35)continue;ctx.beginPath();ctx.moveTo(lm[a].x*canvas.width,lm[a].y*canvas.height);ctx.lineTo(lm[b].x*canvas.width,lm[b].y*canvas.height);ctx.stroke()}for(const index of [0,11,12,13,14,15,16,23,24,25,26,27,28]){const point=lm[index];ctx.beginPath();ctx.arc(point.x*canvas.width,point.y*canvas.height,3.2,0,Math.PI*2);ctx.fill()}
      for(const [side,hand] of Object.entries(hands)){if(!hand.landmarks)continue;ctx.strokeStyle=hand.fist?'#ffcf6a':'#66c8ff';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=Math.max(1.5,canvas.width/650);const handLinks=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];for(const[a,b]of handLinks){ctx.beginPath();ctx.moveTo(hand.landmarks[a].x*canvas.width,hand.landmarks[a].y*canvas.height);ctx.lineTo(hand.landmarks[b].x*canvas.width,hand.landmarks[b].y*canvas.height);ctx.stroke()}const wrist=hand.landmarks[0];ctx.font=`${Math.max(10,canvas.width/46)}px sans-serif`;ctx.fillText(hand.fist?'КУЛАК':'ЛАДОНЬ',wrist.x*canvas.width+6,wrist.y*canvas.height-7)}}
    function trackPose(){
      if(!game.tracking||!poseLandmarker||ui.cameraVideo.readyState<2||game.paused)return;
      if(ui.cameraVideo.currentTime===lastVideoTime)return;const now=performance.now();if(now-lastPoseInferenceAt<40)return;lastPoseInferenceAt=now;lastVideoTime=ui.cameraVideo.currentTime;const result=poseLandmarker.detectForVideo(ui.cameraVideo,now);const raw=result.landmarks?.[0];
      if(!raw){ui.cameraLabel.textContent='ВАС НЕ ВИДНО';setLive('Поза потеряна','warn');return}
      const lm=smoothLandmarks(raw,now);const world=smoothWorld(result.worldLandmarks?.[0],now);const hands=detectHands(raw,now);drawPose(lm,hands);const bodyVisible=fullBodyVisible(lm);const bothHands=hands.left.landmarks&&hands.right.landmarks;ui.cameraLabel.textContent=bodyVisible?(bothHands?'ПОЗА И КИСТИ':'ПОКАЖИТЕ КИСТИ'):'ПРОВЕРЬТЕ КАДР';setLive(bodyVisible?(bothHands?'Поза и кисти':'Нужны обе кисти'):'Видна часть тела',bodyVisible&&bothHands?'good':'warn');
      if(game.calibrating){game.calibrationSamples.push({lm,world});const left=Math.max(0,2.2-(now-game.calibrationStarted)/1000);setCoach('Калибровка',`Стойте ровно ещё ${left.toFixed(1)} сек.`,'warn');if(left<=0)finishCalibration()}
      if(!bodyVisible&&!game.calibrating)setCoach('Видна не вся поза','Отойдите дальше: камера должна видеть голову, кисти и колени.','warn');else if(!game.calibrated&&!game.calibrating)setCoach('Нужна калибровка','Встаньте прямо и нажмите «Калибровка».','good');
      applyPose(lm,world,now,hands)
    }

    function idleRobot(robot,t){const{arms,legs,torso,head,restArms,restLegs}=robot.userData;const breath=Math.sin(t*2)*.025;torso.rotation.y=breath;head.rotation.y=Math.sin(t*.7)*.05;arms[0].shoulder.rotation.set(.95,0,-.42+breath);arms[1].shoulder.rotation.set(.95,0,.42-breath);arms[0].elbow.rotation.z=-.85;arms[1].elbow.rotation.z=.85;for(let index=0;index<arms.length;index++){arms[index].upper.joint.quaternion.slerp(restArms[index].upper,.24);arms[index].lower.joint.quaternion.slerp(restArms[index].lower,.24);arms[index].glove.quaternion.slerp(restArms[index].glove,.24)}for(let index=0;index<legs.length;index++){legs[index].hip.rotation.set(0,0,index===0?-.04:.04);legs[index].thigh.joint.quaternion.copy(restLegs[index].thigh);legs[index].shin.joint.quaternion.copy(restLegs[index].shin);legs[index].knee.rotation.x=-.08}}
    function resolveFighterSeparation(){
      if(game.mode!=='fight'||!fighterB.visible)return;const dx=fighterB.position.x-fighterA.position.x,dz=fighterB.position.z-fighterA.position.z;const gap=Math.hypot(dx,dz),minimum=ARENA.minimumGap;if(gap>=minimum||gap<.001)return;const push=(minimum-gap)/2;fighterA.position.x-=dx/gap*push;fighterA.position.z-=dz/gap*push;fighterB.position.x+=dx/gap*push;fighterB.position.z+=dz/gap*push;
    }
    function updateBot(dt,t){
      if(game.mode!=='fight'||!fighterB.visible)return;const{arms,legs,torso,head,restArms}=fighterB.userData;game.botStun=Math.max(0,game.botStun-dt);game.botLean=mix(game.botLean,0,7,dt);torso.rotation.z=mix(torso.rotation.z,game.botLean,10,dt);head.rotation.z=mix(head.rotation.z,game.botLean*1.4,12,dt);game.botActionTime-=dt;
      if(!game.running){idleRobot(fighterB,t);return}
      if(game.botActionTime<=0){const roll=Math.random();game.botAction=roll<.3?'guard':roll<.82?'attack':'dodge';game.botActionTime=game.botAction==='attack'?1.18:1.0+Math.random()*1.1;game.botHitDone=false;game.botGuard=game.botAction==='guard'}
      const duration=game.botAction==='attack'?1.18:1.8;const progress=1-game.botActionTime/duration;const pulse=Math.sin(clamp(progress,0,1)*Math.PI);const stance=arenaTarget(ARENA.cornerB,ARENA.fightB);
      if(game.botAction==='attack'){const toward=new THREE.Vector3(fighterA.position.x-stance.x,0,fighterA.position.z-stance.z);if(toward.lengthSq()>.01)stance.addScaledVector(toward.normalize(),pulse*.48)}
      const targetAngle=Math.atan2(fighterA.position.x-fighterB.position.x,fighterA.position.z-fighterB.position.z);fighterB.rotation.y=mix(fighterB.rotation.y,targetAngle,9,dt);fighterB.position.x=mix(fighterB.position.x,stance.x,4.2,dt);fighterB.position.z=mix(fighterB.position.z,stance.z,4.2,dt);
      arms[0].shoulder.rotation.set(.96,0,-.44);arms[1].shoulder.rotation.set(.96,0,.44);arms[0].elbow.rotation.z=-.88;arms[1].elbow.rotation.z=.88;legs[0].hip.rotation.set(0,0,-.04);legs[1].hip.rotation.set(0,0,.04);for(let index=0;index<arms.length;index++){arms[index].upper.joint.quaternion.slerp(restArms[index].upper,1-Math.exp(-12*dt));arms[index].lower.joint.quaternion.slerp(restArms[index].lower,1-Math.exp(-12*dt))}
      if(game.botAction==='guard'){arms[0].shoulder.rotation.x=.65;arms[1].shoulder.rotation.x=.65;arms[0].elbow.rotation.z=-1.28;arms[1].elbow.rotation.z=1.28}
      if(game.botAction==='dodge'){torso.rotation.z=Math.sin(t*5)*.2}
      if(game.botAction==='attack'){
        fighterB.updateWorldMatrix(true,true);const target=fighterA.userData.torso.getWorldPosition(hitPointB);target.y+=.72;const shoulder=arms[0].upper.joint.getWorldPosition(hitPointC);aimBone(arms[0].upper.joint,target.clone().sub(shoulder),36,dt);fighterB.updateWorldMatrix(true,true);const elbow=arms[0].lower.joint.getWorldPosition(hitPointC);aimBone(arms[0].lower.joint,target.clone().sub(elbow),48,dt);
        if(progress>.34&&!game.botHitDone){const impact=findImpact(fighterB,fighterA,'left',game.playerGuarded);if(impact){game.botHitDone=true;const blocked=impact.kind==='block';const damage=blocked?2:impact.kind==='head'?11:8;game.playerHealth=clamp(game.playerHealth-damage,0,100);if(blocked){game.blocks++;showImpact('БЛОК');applyRecoil(fighterA,fighterB,2)}else{game.combo=0;showImpact(impact.kind==='head'?'УДАР В ГОЛОВУ':'ПРОПУЩЕН');applyRecoil(fighterA,fighterB,damage)}if(game.playerHealth<=0)endRound('ПОРАЖЕНИЕ')}}
      }
    }

    function setMode(mode){
      game.mode=mode;game.demoMode=mode==='fight'&&(!game.tracking||!game.calibrated);game.paused=false;ui.pause.textContent='Пауза';game.running=mode==='fight';fighterB.visible=true;fighterA.position.copy(mode==='fight'?ARENA.cornerA:ARENA.trainingA);fighterB.position.copy(mode==='fight'?ARENA.cornerB:ARENA.trainingB);fighterA.rotation.y=Math.atan2(fighterB.position.x-fighterA.position.x,fighterB.position.z-fighterA.position.z);fighterB.rotation.y=Math.atan2(fighterA.position.x-fighterB.position.x,fighterA.position.z-fighterB.position.z);ui.training.classList.toggle('active',mode==='training');ui.fight.classList.toggle('active',mode==='fight');ui.botCard.style.visibility=mode==='fight'?'visible':'hidden';ui.roundLabel.textContent=mode==='fight'?(game.demoMode?'ДЕМО':'РАУНД 1'):'ТРЕНИРОВКА';game.time=60;game.fightElapsed=0;game.playerHealth=100;game.botHealth=100;game.hits=0;game.blocks=0;game.combo=0;game.maxCombo=0;game.guardKind='none';game.playerGuarded=false;game.playerRecoil.set(0,0);game.botRecoil.set(0,0);game.punches.left=freshPunch();game.punches.right=freshPunch();game.botAction='guard';game.botActionTime=1.3;ui.result.classList.remove('show');if(mode==='training')setTrainingCamera();setCoach(mode==='fight'?(game.demoMode?'Демо боя':'Бой начался'):'Тренировка',mode==='fight'?(game.demoMode?'Для управления включите камеру и пройдите калибровку.':'После сигнала оба бойца выходят из своих углов.'):'Отрабатывайте движение перед соперником.',game.demoMode?'warn':'good')
    }
    function endRound(title){game.running=false;game.paused=true;ui.resultTitle.textContent=title;ui.resultStats.textContent=`Точные удары: ${game.hits} · Блоки: ${game.blocks} · Лучшая серия: ${game.maxCombo}`;ui.result.classList.add('show')}
    function updateGame(dt,t){if(game.paused)return;if(game.mode==='fight'&&game.running){game.fightElapsed+=dt;game.time=Math.max(0,game.time-dt);if(!game.tracking){const target=arenaTarget(ARENA.cornerA,ARENA.fightA);fighterA.position.x=mix(fighterA.position.x,target.x,3.2,dt);fighterA.position.z=mix(fighterA.position.z,target.z,3.2,dt)}if(game.time<=0)endRound(game.botHealth<game.playerHealth?'ПОБЕДА':game.botHealth>game.playerHealth?'ПОРАЖЕНИЕ':'НИЧЬЯ')}for(const [robot,recoil] of [[fighterA,game.playerRecoil],[fighterB,game.botRecoil]]){robot.position.x=clamp(robot.position.x+recoil.x,-ARENA.ringLimit,ARENA.ringLimit);robot.position.z=clamp(robot.position.z+recoil.y,-ARENA.ringLimit,ARENA.ringLimit);recoil.multiplyScalar(Math.exp(-7.5*dt))}ui.healthA.style.width=`${game.playerHealth}%`;ui.healthB.style.width=`${game.botHealth}%`;ui.roundTime.textContent=game.mode==='fight'?Math.ceil(game.time):'—';updateBot(dt,t);resolveFighterSeparation()}

    const cameraMidpoint=new THREE.Vector3(),cameraDesired=new THREE.Vector3(),cameraOffset=new THREE.Vector3(.58,.38,1).normalize();
    function setTrainingCamera(){const portrait=innerWidth/innerHeight<.8;camera.position.set(portrait?9.6:6.8,portrait?7.2:5.6,portrait?18.5:11.5);controls.target.set(0,2.45,0)}
    function updateFightCamera(dt){if(game.mode!=='fight')return;cameraMidpoint.copy(fighterA.position).add(fighterB.position).multiplyScalar(.5);cameraMidpoint.y=2.35;const spacing=fighterDistance();const aspectBoost=clamp(.88/camera.aspect,1,1.72);const distance=clamp(10.6+spacing*.62,13.4,22)*aspectBoost;cameraDesired.copy(cameraOffset).multiplyScalar(distance).add(cameraMidpoint);camera.position.lerp(cameraDesired,1-Math.exp(-3.4*dt));controls.target.lerp(cameraMidpoint,1-Math.exp(-5*dt))}

    ui.cameraToggle.onclick=enableCamera;ui.calibrate.onclick=beginCalibration;ui.training.onclick=()=>setMode('training');ui.fight.onclick=()=>setMode('fight');ui.mirror.onclick=()=>{game.mirrored=!game.mirrored;ui.mirror.textContent=`Зеркало: ${game.mirrored?'вкл.':'выкл.'}`};ui.pause.onclick=()=>{game.paused=!game.paused;ui.pause.textContent=game.paused?'Продолжить':'Пауза'};ui.restart.onclick=()=>{game.paused=false;setMode('fight')};
    addEventListener('message',event=>{if(event.origin!==location.origin)return;const data=event.data;if(data?.type==='motiontwin-pose'&&Array.isArray(data.landmarks)){const now=performance.now();game.tracking=true;applyPose(smoothLandmarks(data.landmarks,now),smoothWorld(data.world,now),now)}});
    const clock=new THREE.Clock();
    function render(){requestAnimationFrame(render);const now=performance.now(),dt=Math.min(.05,(now-lastTime)/1000);lastTime=now;game.renderFps=mix(game.renderFps,1/Math.max(dt,.001),3,dt);const t=clock.getElapsedTime();if(!game.tracking)idleRobot(fighterA,t);if(game.mode!=='fight')idleRobot(fighterB,t);trackPose();updateGame(dt,t);updateFightCamera(dt);controls.enabled=game.mode==='training';controls.update();renderer.render(scene,camera)}
    setMode('training');render();
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(game.mode==='training')setTrainingCamera()});
  </script>
